# Stuart's video for the HRI 2027 Student Design Competition (3 minutes at most). Rendered by tools/video/edit.py:
#   python tools/video/edit.py --plan        # the timing, and which shots are still placeholders
#   python tools/video/edit.py --preview     # quick 540p cut
#   python tools/video/edit.py               # the final 1080p video -> video/out/stuart_hri2027_sdc.mp4
# How each shot is filmed: docs/video_shot_list.md. A segment whose footage does not exist yet renders as a "Shot needed" card
# (its `placeholder` line) for its planned length, so the cut can be timed before everything is filmed.
#
# The story (paper, sections 1 and 4): Stuart changes HOW it communicates by zone, not WHAT it does.
#   1. Hook: a quiet and a lively library (photos), then the title.
#   2. How Stuart works: the robot (CAD, prototype), the two interaction styles, the system, the parts, the sound map.
#   3. Common area: a person approaches (webcam with the face found + the robot's face), asks to return a book, the webcam view
#      swaps to the RFID reader scanning it, Stuart answers aloud; the person leaves.
#   4. Stuart drives the book to the Fiction section (the 18 Nov clip + a simulated map) and heads back. The unloading (CAD simulation) sits between the two drives.
#   5. On the way, a person in a quiet zone asks questions (no return): the same views, answers as text, no sound. The end.
# Disclosures (paper, section 5): the face screen and the maps are simulated or recorded from a simulated robot, and say so.

output: video/out/stuart_hri2027_sdc.mp4
max_seconds: 180
recordings: recordings
voiceover: {wav: video/voiceover.wav, duck_db: 14}       # record the script in video/voiceover.md; until then a placeholder

segments:
  # ---- Hook: two library photos (Wikimedia Commons, credited on the frame) ----
  - id: hook-quiet
    type: photo
    image: video/assets/photos/library_quiet.jpg
    duration: 5.5
    zone: quiet
    text: "Libraries have quiet zones and lively zones."
    credit: "Photo: Guywelch2000, CC BY 4.0, Wikimedia Commons"
    vo: "Libraries are not one kind of space. Some rooms are silent,"

  - id: hook-lively
    type: photo
    image: video/assets/photos/library_lively.jpg
    duration: 8
    zone: common
    text: "Robots usually behave the same everywhere."
    credit: "Photo: brewbooks, CC BY-SA 2.0, Wikimedia Commons"
    vo: "others are lively, and people expect different behaviour in each. Service robots usually behave the same everywhere. Stuart doesn't."

  - id: title
    type: title
    duration: 4
    title: Stuart
    subtitle: A library robot that reads the room

  # ---- How Stuart works, scene 1: the robot (its design, in four pictures), then the two interaction styles ----
  - id: robot-concept
    type: photo
    image: video/assets/paper/concept_ai.png
    fit: contain
    duration: 2.5
    label: "Concept (AI-generated image)"
    vo: "Meet Stuart, a library robot that returns books and helps patrons, working alongside librarians."

  - id: robot-cad
    type: photo
    image: video/assets/paper/cad_prototype.png
    fit: contain
    duration: 3.5
    label: "Design V2 render"

  - id: robot-prototype
    type: photo
    image: video/assets/paper/prototype.jpg
    fit: contain
    duration: 2.5
    label: "Prototype (in progress)"

  - id: styles
    type: stills
    duration: 7
    images: [video/assets/paper/fig6_common_v5.png, video/assets/paper/fig6_quiet_v5.png]
    labels: [Common area, Quiet zone]
    text: "The same task, two styles"
    vo: "It changes how it communicates, not what it does, depending on where it is."

  # ---- How Stuart works, scene 2: the system and its parts ----
  - id: system
    type: stills
    duration: 8.5
    images: [video/assets/system.png]
    vo: "A Jetson handles the conversation and the screen. A TurtleBot base handles navigation and measures the sound level."

  - id: parts
    type: stills
    duration: 9
    images: [video/assets/parts.png]
    vo: "An RFID reader identifies books, a LiDAR sees obstacles, and a small screen shows Stuart's face."

  # ---- The two maps (images from the paper, Fig. 3) ----
  - id: maps
    type: stills
    duration: 12
    images: [video/assets/paper/nav_map.png, video/assets/paper/sound_map.png]
    labels: ["Map Stuart navigates on", "Sound levels recorded on it"]
    text: "Learning the zones"
    vo: "As it drives around, Stuart measures the sound level and builds a sound map. Quiet places become quiet zones, and lively places become common areas."

  # ---- Common area: the real run (19 Nov): the operator page showing the webcam with the face found, Stuart's face and the state machine.
  # A person walks up, Stuart greets and offers, the visitor's request is typed by the operator (speech input is not wired in), the book
  # is read by the RFID reader, and Stuart confirms. recordings/rfid1 is made by tools/video/session_to_take.py from the robot's session
  # log and the screen recording (no sound in it: Stuart's lines are made again with the TTS and placed where the log says he said them).
  - id: common-card
    type: title
    duration: 3
    title: Common area
    subtitle: Stuart greets people and speaks
    vo: "In the common area, Stuart greets people and talks."

  # The 11:31 run of 20 Nov (recordings/live3: the screen recording + the robot's session log + the REAL sound: Stuart's speaker and the
  # microphone, recorded by tools/video/film.py as recordings/rfid3 and put under the picture by session_to_take.py --sound-take). The visitor
  # and Stuart are heard as they were. Waits with nobody speaking are sped up (their sound is muted); every stretch with a voice plays at x1.
  - id: live-approach
    type: clip
    zone: common
    take: live3
    source: screen
    in: 17.9
    out: 29.0
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    caption_at: top
    badge: "Live view"

  - id: live-ask
    type: clip
    zone: common
    take: live3
    source: screen
    in: 29.0
    out: 33.8
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    caption_at: top
    badge: "Live view"

  - id: live-think
    type: clip
    zone: common
    take: live3
    source: screen
    in: 33.8
    out: 39.4
    speed: 3
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    badge: "Live view"

  - id: live-answer
    type: clip
    zone: common
    take: live3
    source: screen
    in: 39.4
    out: 58.8
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    caption_at: top
    badge: "Live view"

  - id: live-wait
    type: clip
    zone: common
    take: live3
    source: screen
    in: 58.8
    out: 62.8
    speed: 4
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    badge: "Live view"

  - id: live-return
    type: clip
    zone: common
    take: live3
    source: screen
    in: 62.8
    out: 68.6
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    caption_at: top
    badge: "Live view"

  - id: live-place
    type: clip
    zone: common
    take: live3
    source: screen
    in: 68.6
    out: 72.0
    speed: 3
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    badge: "Live view"

  - id: live-scan
    type: clip
    zone: common
    take: live3
    source: screen
    in: 72.0
    out: 83.4
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    badge: "Live view: the RFID reader reads the book"
    inset: {src: video/footage/cad_book_return_v2.mp4, in: 0, out: end, speed: 1, at: 0.7, width: 360,
            label: "Loading the book (CAD simulation)"}

  - id: live-goodbye
    type: clip
    zone: common
    take: live3
    source: screen
    in: 83.4
    out: 91.9
    crop: [78, 172, 1252, 520]
    valign: bottom
    voice: {take: live3, source: audio}
    auto_captions: true
    caption_at: top
    badge: "Live view"

  # ---- Stuart takes the book to Fiction and heads back (18 Nov clips). The map next to each clip replays the real track of that drive
  # from the robot's session log (video/takes/trips_18nov.json), so the dot is where the robot was. The phone clips start at 18:27:36 and
  # 18:29:06; the replays start at 18:27:35 and 18:28:38, so the second clip is the last 26 s of its drive.
  - id: trip-out
    type: split
    left: {src: video/footage/trip_to_fiction.mp4, in: 0, out: end, speed: 6, label: "Stuart driving to Fiction"}
    right: {take: nav2, source: map, in: "event:drive_started+0.6s", out: "event:drive_started+47.6s", speed: 6, crop: [22, 10, 922, 1062], label: "Map (replay of this drive)",
            placeholder: "recordings/nav2/map.mp4"}
    audio_from: none
    badge: "Drive started by an operator"
    vo: "When the patron leaves, Stuart carries the returned books to their section, here Fiction,"

  # The unloading (CAD simulation, 8.2 s at x2): the lift sets the returned book into the trolley at the Fiction section.
  - id: unload
    type: clip
    zone: common
    src: video/footage/cad_unloading.mp4
    in: 0
    out: end
    speed: 2
    audio: mute
    badge: "CAD simulation of unloading the books"

  - id: trip-back
    type: split
    left: {src: video/footage/trip_back.mp4, in: 0, out: end, speed: 6, label: "Back to its station"}
    right: {take: nav2, source: map, in: "event:drive_started#2+27.6s", out: "event:drive_started#2+54.1s", speed: 6, crop: [22, 10, 922, 1062], label: "Map (replay of this drive)",
            placeholder: "recordings/nav2/map.mp4"}
    audio_from: none
    badge: "Drive started by an operator"
    vo: "and then heads back to its station."

  # ---- Quiet zone, on the way back: the 21:06 run of 19 Nov (recordings/quiet4: the screen recording + the robot's session log). Nothing is
  # said aloud: the face screen shows the answers as text. The visitor's words are typed by the operator. Slow stretches are sped up.
  - id: quiet
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 13.6
    out: 21.6
    speed: 2
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"
    vo: "On the way, Stuart enters a quiet zone, which it knows from its sound map. Here it never calls out. It waits for someone to come to it, then greets them and answers in text on the screen, with no sound, so students nearby can keep working. Same task, different style."

  - id: quiet-wait
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 21.6
    out: 31.3
    speed: 5
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  - id: quiet-ask
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 31.3
    out: 38.5
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  - id: quiet-read
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 38.5
    out: 43.3
    speed: 3
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  - id: quiet-directions
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 43.3
    out: 48.5
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  - id: quiet-pause
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 48.5
    out: 52.1
    speed: 3
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  - id: quiet-thanks
    type: clip
    zone: quiet
    take: quiet4
    source: screen
    in: 52.1
    out: 56.0
    crop: [78, 172, 1252, 520]
    valign: bottom
    audio: mute
    auto_captions: true
    caption_at: top
    badge: "Live view. Visitor's words typed by the operator"

  # ---- The end ----
  - id: end
    type: title
    duration: 4
    title: Stuart
    subtitle: A library robot that reads the room
    footer: "CARES Lab, University of Auckland"
    vo: "Stuart: a library robot that reads the room."

  # The last word, as a plain card after the end card.
  - id: thanks
    type: title
    duration: 2.5
    title: Thank you
    vo: "Thank you."
