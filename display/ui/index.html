<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot face</title>
<style>
  /* Sizes are in units of a 1024x600 7-inch screen (--u = 1 px there): body text 28 px, buttons at least 64 px. */
  :root { --u: min(calc(100vw / 1024), calc(100vh / 600)); --cyan: #2debeb; --ink: #dffcfc; --muted: #8fc9c9;
          --panel: #071a1c; --line: #164a4d; --scale: 1; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; color: var(--ink);
               font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  body.zone-quiet { --scale: 1.12; }                 /* a quiet zone reads instead of listening: larger text */
  body.touch { cursor: auto; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  /* split: small animated eyes stay in the top-left corner while content is shown */
  body.split canvas { inset: auto; top: calc(10 * var(--u)); left: calc(10 * var(--u)); width: calc(170 * var(--u));
                      height: calc(108 * var(--u)); border-radius: calc(16 * var(--u)); }
  body.full.captioned canvas { height: 76%; }
  #view { position: fixed; inset: 0; box-sizing: border-box; display: none; }
  body.split #view { display: block; padding: calc(16 * var(--u)) calc(20 * var(--u)) calc(16 * var(--u)) calc(196 * var(--u)); }
  body.full #view { display: block; pointer-events: none; }
  #view * { box-sizing: border-box; }
  #view h1 { margin: 0; font-weight: 700; color: #fff; font-size: calc(38 * var(--u) * var(--scale)); line-height: 1.2; }
  .clamp1, .clamp2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp1 { -webkit-line-clamp: 1; } .clamp2 { -webkit-line-clamp: 2; }
  .btn { font: inherit; font-size: calc(28 * var(--u) * var(--scale)); min-height: calc(64 * var(--u)); padding: 0 calc(26 * var(--u));
         color: var(--cyan); background: transparent; border: calc(3 * var(--u)) solid var(--cyan); border-radius: calc(32 * var(--u));
         cursor: pointer; }
  .btn.primary { color: #001314; background: var(--cyan); }
  .btn:active { background: #fff; color: #000; }
  .buttons { display: flex; flex-wrap: wrap; gap: calc(14 * var(--u)); }
  .badges { display: flex; flex-wrap: wrap; gap: calc(10 * var(--u)); }
  .badge { font-size: calc(26 * var(--u) * var(--scale)); padding: calc(4 * var(--u)) calc(14 * var(--u)); border-radius: calc(10 * var(--u));
           background: var(--panel); border: calc(2 * var(--u)) solid var(--line); color: var(--cyan); }
  .cover { display: block; object-fit: cover; background: #0b2426; border-radius: calc(10 * var(--u)); }

  /* face: a caption under the face (quiet zone) */
  .view-face .caption { position: absolute; left: calc(60 * var(--u)); right: calc(60 * var(--u)); bottom: calc(28 * var(--u));
                        padding: calc(14 * var(--u)) calc(26 * var(--u)); border-radius: calc(20 * var(--u));
                        background: rgba(7, 26, 28, .78); border: calc(2 * var(--u)) solid var(--line);
                        text-align: center; font-size: calc(30 * var(--u) * var(--scale)); line-height: 1.3; color: var(--ink);
                        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  /* a long caption is shrunk and given more lines, and the face makes room: in a quiet zone it is READ, so it is never cut off */
  .view-face .caption.long { font-size: calc(25 * var(--u) * var(--scale)); -webkit-line-clamp: 6; padding: calc(12 * var(--u)) calc(22 * var(--u)); }
  body.full.captioned-long canvas { height: 52%; }

  /* what the robot would have said, to read (quiet zones): under the content, never cut off */
  .message { margin: 0; font-size: calc(28 * var(--u) * var(--scale)); line-height: 1.32; color: var(--ink); }
  .message.long { font-size: calc(24 * var(--u) * var(--scale)); }

  /* quiet zone: the screen is the robot's only voice, so no word of it is cut off with "...": nothing is clamped and the text is
     shrunk until it fits (views.js fit()) */
  body.zone-quiet .clamp1, body.zone-quiet .clamp2, body.zone-quiet .item-reason, body.zone-quiet .view-face .caption,
  body.zone-quiet .view-face .caption.long { display: block !important; -webkit-line-clamp: unset !important; overflow: visible !important; }
  body.zone-quiet .view-face .caption { max-height: 52%; overflow: hidden !important; }
  body.zone-quiet.full.captioned canvas { height: 52%; }
  body.zone-quiet .view-options .opt-head { flex: none; }      /* it grows with what is said (and the text is shrunk to fit), it is not squeezed */

  /* book_card */
  .view-card { height: 100%; display: grid; grid-template-columns: calc(240 * var(--u)) 1fr; gap: calc(26 * var(--u)); align-items: center; }
  .view-card .cover { width: calc(240 * var(--u)); height: calc(360 * var(--u)); }
  .card-info { display: flex; flex-direction: column; gap: calc(12 * var(--u)); min-width: 0; }
  .card-info .author { font-size: calc(28 * var(--u) * var(--scale)); color: var(--muted); }
  .card-info .summary { margin: 0; font-size: calc(28 * var(--u) * var(--scale)); line-height: 1.3; }
  .card-info .buttons { margin-top: calc(6 * var(--u)); }
  /* with a message: a small cover and the title beside it, the message across the whole width, the buttons last */
  .view-card.has-message { grid-template-columns: calc(150 * var(--u)) 1fr; grid-template-rows: auto 1fr auto; align-items: start;
                           gap: calc(14 * var(--u)) calc(26 * var(--u)); }
  .view-card.has-message .cover { width: calc(150 * var(--u)); height: calc(225 * var(--u)); }
  .view-card.has-message .card-info { justify-content: center; min-height: calc(225 * var(--u)); }
  .view-card.has-message .message { grid-column: 1 / -1; align-self: start; }
  .view-card.has-message > .buttons { grid-column: 1 / -1; align-self: end; }

  /* book_list */
  .view-list { height: 100%; display: flex; flex-direction: column; gap: calc(14 * var(--u)); }
  .view-list .list-with-message { display: grid; grid-template-columns: calc(257 * var(--u)) 1fr; gap: calc(26 * var(--u)); align-items: start; }
  .view-list .list-with-message .list-row { grid-template-columns: 1fr; }
  .view-list.has-message .list-row.many .list-item { min-height: calc(330 * var(--u)); }
  .view-list .heading { font-size: calc(32 * var(--u) * var(--scale)); color: var(--cyan); }
  .list-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(16 * var(--u)); align-items: start; }
  .list-item { font: inherit; color: inherit; background: var(--panel); border: calc(2 * var(--u)) solid var(--line);
               border-radius: calc(14 * var(--u)); padding: calc(12 * var(--u)); display: flex; flex-direction: column;
               align-items: center; justify-content: flex-start; gap: calc(8 * var(--u)); cursor: pointer; text-align: center;
               min-width: 0; min-height: calc(470 * var(--u)); }
  .list-item:active { border-color: var(--cyan); }
  .list-item .cover { width: calc(150 * var(--u)); height: calc(225 * var(--u)); flex: none; }
  .item-title { font-size: calc(28 * var(--u)); font-weight: 700; color: #fff; line-height: 1.2; }
  .item-reason { font-size: calc(24 * var(--u) * var(--scale)); color: var(--muted); line-height: 1.25;
                 -webkit-line-clamp: 4 !important; }

  /* directions */
  .view-directions { height: 100%; display: grid; grid-template-columns: 1.35fr 1fr; gap: calc(18 * var(--u)); }
  .map { min-width: 0; min-height: 0; display: flex; align-items: center; }
  .plan { width: 100%; height: 100%; }
  .plan .floor { fill: #031012; stroke: var(--line); stroke-width: 0.08; }
  .plan .section { fill: #0b2b2e; stroke: #1d6468; stroke-width: 0.06; }
  .plan .section.hi { fill: rgba(45, 235, 235, .28); stroke: var(--cyan); stroke-width: 0.12; }
  .plan .section-label { fill: var(--muted); font-weight: 700; }
  .plan .section-label.hi { fill: #fff; }
  .plan .landmark { fill: #1b1b1b; stroke: #ffb469; stroke-width: 0.06; }
  .plan .landmark.lift { fill: #3a2a10; }
  .plan .landmark-icon { fill: #ffb469; font-weight: 700; }
  .plan .path { fill: none; stroke: var(--cyan); stroke-width: 0.14; stroke-dasharray: 0.35 0.25; stroke-linecap: round;
                stroke-linejoin: round; }
  .plan .target { fill: #fff; } .plan .target-ring { fill: none; stroke: #fff; stroke-width: 0.08; }
  .plan .robot { fill: var(--cyan); stroke: #fff; stroke-width: 0.06; }
  .plan .robot-label { fill: #fff; font-weight: 700; }
  .view-directions .side { display: flex; flex-direction: column; justify-content: center; gap: calc(12 * var(--u)); min-width: 0; }
  .view-directions .badge { font-size: calc(24 * var(--u) * var(--scale)); }
  .view-directions.has-message { grid-template-rows: minmax(0, 1fr) auto; }
  .view-directions .message { grid-column: 1 / -1; font-size: calc(24 * var(--u) * var(--scale)); }
  .steps { margin: 0; padding-left: calc(36 * var(--u)); font-size: calc(28 * var(--u) * var(--scale)); line-height: 1.3; }
  .steps li + li { margin-top: calc(6 * var(--u)); }
  .distance { font-size: calc(28 * var(--u) * var(--scale)); color: var(--cyan); font-weight: 700; }

  /* options */
  .view-options { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: calc(20 * var(--u)); }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(16 * var(--u)); }
  .option-grid .btn { min-height: calc(92 * var(--u)); font-size: calc(30 * var(--u) * var(--scale)); border-radius: calc(20 * var(--u));
                      padding: calc(8 * var(--u)) calc(16 * var(--u)); }
  .option-grid.many .btn { min-height: calc(72 * var(--u)); }

  /* options as cards: a header beside the face, then the main choices under it across the whole width */
  .view-options .opt-head { min-height: calc(96 * var(--u)); display: flex; flex-direction: column; justify-content: center; gap: calc(4 * var(--u)); }
  .view-options .eyebrow { font-size: calc(20 * var(--u)); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .view-options .opt-head .heading { font-size: calc(46 * var(--u) * var(--scale)); }
  #view .view-options .opt-head .heading.long { font-size: calc(32 * var(--u) * var(--scale)); line-height: 1.25; -webkit-line-clamp: 5; }   /* read, not cut off */
  .opt-cards { display: grid; gap: calc(18 * var(--u)); margin-left: calc(-176 * var(--u)); margin-top: calc(10 * var(--u)); grid-template-columns: repeat(3, 1fr); }
  .opt-cards.n1 { grid-template-columns: 1fr; } .opt-cards.n2 { grid-template-columns: 1fr 1fr; }
  .opt-card { font: inherit; color: var(--ink); text-align: left; display: flex; flex-direction: column; gap: calc(10 * var(--u));
              padding: calc(22 * var(--u)); min-height: calc(230 * var(--u)); cursor: pointer;
              background: linear-gradient(160deg, #0a2a2d, var(--panel)); border: calc(2 * var(--u)) solid var(--line);
              border-radius: calc(22 * var(--u)); box-shadow: 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(0, 0, 0, .5); }
  .opt-card:active { border-color: var(--cyan); background: #0d3a3d; }
  .card-icon { width: calc(64 * var(--u)); height: calc(64 * var(--u)); padding: calc(14 * var(--u)); border-radius: 50%; color: var(--cyan);
               background: rgba(45, 235, 235, .1); border: calc(2 * var(--u)) solid rgba(45, 235, 235, .35); }
  .card-name { font-size: calc(32 * var(--u) * var(--scale)); font-weight: 700; color: #fff; line-height: 1.15; margin-top: auto; }
  .card-hint { font-size: calc(22 * var(--u) * var(--scale)); color: var(--muted); line-height: 1.25; }
  .opt-extra { display: flex; gap: calc(14 * var(--u)); margin: calc(18 * var(--u)) 0 0 calc(-176 * var(--u)); }
  .opt-extra .btn { min-height: calc(56 * var(--u)); font-size: calc(24 * var(--u) * var(--scale)); color: var(--muted); border-color: var(--line); }

  /* status */
  .view-status { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: calc(16 * var(--u)); }
  .view-status .heading { color: var(--cyan); }
  .view-status .destination { font-size: calc(40 * var(--u) * var(--scale)); color: #fff; font-weight: 700; }
  .books-left { font-size: calc(32 * var(--u) * var(--scale)); color: var(--muted); }
  .books-left .count { font-size: calc(72 * var(--u)); color: var(--cyan); font-weight: 700; }
  .view-status .detail { font-size: calc(28 * var(--u) * var(--scale)); color: var(--muted); }

  /* thinking: a slim bar sweeping along the bottom edge, in both layouts */
  #progress { position: fixed; left: 0; right: 0; bottom: 0; height: calc(6 * var(--u)); overflow: hidden; display: none;
              pointer-events: none; }
  body.thinking #progress { display: block; }
  #progress::before { content: ""; position: absolute; top: 0; bottom: 0; width: 28%; border-radius: calc(3 * var(--u));
                      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
                      animation: sweep 1.4s ease-in-out infinite; }
  @keyframes sweep { from { left: -30%; } to { left: 102%; } }
  #state { position: fixed; bottom: calc(4 * var(--u)); left: calc(8 * var(--u)); font: calc(14 * var(--u)) monospace; color: #155; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="view"></div>
<div id="progress" aria-hidden="true"></div>
<div id="state"></div>
<script src="views.js"></script>
<script>
"use strict";
// Robot face: glowing cyan eyes and a thin mouth on pure black.
// Every expression is one parameter set; each frame the current parameters ease toward the target,
// and blink / gaze / tremble are layered on top. Events arrive over Server-Sent Events:
//   {"emotion": "happy", "hold_s": 3.0}      ("idle" returns to the resting face)
//   {"talk": {"levels": [0..1, ...], "fps": 30, "delay_s": 0}}   mouth follows a speech loudness envelope
//   {"talk": {"seconds": 3}}                                       generic talking (0 stops)
//   {"screen": {"state_path", "zone", "layout": "full_face"|"split", "view", "payload", "ttl_s", ...}}
//         what the screen composer (robot/core/screen.py) wants shown; views.js draws it; a button POSTs /input {"choice": id}
// Screenshots and checks without the robot: ?update=<ScreenUpdate as JSON> draws that screen straight away.
// Debug: open the page with ?emotion=happy to freeze that face without a server (&talk=0.7 opens the mouth).

// ---------- expressions ----------
// Eye (units are 1/110 of the screen width, origin at the screen centre):
//   x centre distance, y vertical offset, w/h size, r corner roundness (0 box .. 1 pill),
//   tilt lid angle in degrees (+ inner corner down, - inner corner up), top/bot lid cut (fraction of h),
//   bite removes the lower part with an ellipse, leaving an upward arc (happy ^ ^).
// Mouth: mw half width, my y, bend (+ smile, - frown), thick line width, open height of the lower lip,
//   fill interior opacity, skew right end lower than left, wave S-shaped wobble, wob animated wobble.
const eye = o => Object.assign({ x: 27, y: -4, w: 16, h: 21, r: 1, tilt: 0, top: 0, bot: 0, bite: 0 }, o);
const mouth = o => Object.assign({ mw: 9, my: 24, bend: 2.2, thick: 1.6, open: 0, fill: 0, skew: 0, wave: 0, wob: 0 }, o);
const CYAN = [45, 235, 235];
const face = (e, m, extra = {}) => ({
  l: eye(e), r: eye(Object.assign({}, e, extra.r || {})), m: mouth(m),
  c: extra.c || CYAN, tremble: extra.tremble || 0,
});

const FACES = {
  neutral:  face({}, {}),
  happy:    face({ w: 19, h: 21, bite: 1, y: -3 }, { mw: 12, bend: 5.5, my: 21, thick: 1.7 }),
  sad:      face({ w: 14, h: 16, tilt: -22, top: 0.12, y: -2 }, { mw: 8, bend: -3.2, my: 28, thick: 1.6 }),
  angry:    face({ w: 17, h: 17, r: 0.55, tilt: 26, top: 0.18, y: -3 }, { mw: 8.5, bend: -0.8, my: 26, thick: 2 }),
  surprise: face({ w: 22, h: 22, y: -5 }, { mw: 3.4, bend: 0, my: 22, open: 3.4, thick: 1.5 }),
  fear:     face({ w: 17, h: 26, tilt: -8, y: -6 }, { mw: 6, bend: -1.6, my: 27, thick: 1.4, wob: 1 }, { tremble: 0.35 }),
  disgust:  face({ w: 17, h: 15, r: 0.5, top: 0.38, y: -2 }, { mw: 9, bend: -1, my: 27, thick: 1.6, wave: 3, skew: 3 },
                 { r: { h: 12, y: 0, top: 0.32 } }),
  // thinking: slightly narrowed eyes looking up and to one side, a small flat mouth (the LLM is working)
  thinking: face({ w: 15, h: 17, top: 0.1, y: -4 }, { mw: 5, bend: 0.4, my: 26, thick: 1.5 }),
};
const ALIASES = {
  idle: "idle", neutral: "neutral", calm: "neutral", normal: "neutral",
  happy: "happy", joy: "happy", happiness: "happy", smile: "happy",
  sad: "sad", sadness: "sad", unhappy: "sad",
  angry: "angry", anger: "angry", mad: "angry",
  surprise: "surprise", surprised: "surprise", shock: "surprise",
  fear: "fear", scared: "fear", afraid: "fear", fearful: "fear",
  disgust: "disgust", disgusted: "disgust",
  thinking: "thinking",
};

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function approach(cur, tgt, k) {            // ease every number in cur toward tgt
  for (const key of Object.keys(tgt)) {
    if (typeof tgt[key] === "object") approach(cur[key], tgt[key], k);
    else cur[key] += (tgt[key] - cur[key]) * k;
  }
}

// ---------- state ----------
const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d", { alpha: false });
// Glow: the face is drawn once into a small canvas (1/GLOW_DIV of the screen), blurred twice there
// (tight halo and wide bloom) and drawn under the sharp face. Blurring a small canvas is cheap;
// nothing is blurred at full resolution. ?glow=cheap skips the blur filter (blocky upscale only),
// ?glow=off draws no glow, for slow devices.
const GLOW_DIV = 3;
const glowMode = new URLSearchParams(location.search).get("glow") || "blur";
const offscreen = () => { const cv = document.createElement("canvas"); return { cv, ctx: cv.getContext("2d") }; };
const glowSrc = offscreen();
const GLOWS = [
  Object.assign(offscreen(), { blur: 0.7, alpha: 0.9 }),   // blur radius in face units
  Object.assign(offscreen(), { blur: 2.6, alpha: 0.75 }),
];
const canBlur = typeof glowSrc.ctx.filter === "string";

const cur = clone(FACES.neutral);
let emotion = "idle", holdUntil = 0;
let W = 0, H = 0, scale = 1, dpr = 1;
const params = new URLSearchParams(location.search);
const frozenTalk = clamp(Number(params.get("talk")) || 0, 0, 1);
const preview = params.has("preview");          // embedded in the operator page: look, don't touch
if (preview) document.documentElement.style.pointerEvents = "none";
const frozen = (ALIASES[(params.get("emotion") || "").toLowerCase()] || "").replace("idle", "neutral") || null;

function setEmotion(name, holdS, now) {
  emotion = name;
  holdUntil = name === "idle" ? 0 : now + holdS * 1000;
}

// talking: the mouth opens with a loudness envelope from the TTS audio, or babbles for a duration
const talk = { start: 0, until: 0, levels: null, fps: 30, level: 0 };
function startTalk(t, now) {
  talk.start = now + clamp(Number(t.delay_s) || 0, 0, 5) * 1000;
  if (Array.isArray(t.levels)) {
    talk.levels = t.levels.map(v => clamp(Number(v) || 0, 0, 1));
    talk.fps = Number(t.fps) > 0 ? Number(t.fps) : 30;
    talk.until = talk.start + talk.levels.length / talk.fps * 1000;
  } else {
    talk.levels = null;
    talk.until = talk.start + Math.max(0, Number(t.seconds) || 0) * 1000;
  }
}
const isTalking = now => now < talk.until;
function talkTarget(now) {
  if (now < talk.start || now >= talk.until) return 0;
  const t = (now - talk.start) / 1000;
  if (talk.levels) {
    const f = t * talk.fps, i = Math.floor(f);
    const a = talk.levels[i] || 0, b = talk.levels[i + 1] || 0;
    return a + (b - a) * (f - i);
  }
  const syllable = Math.abs(Math.sin(t * Math.PI * 4.6));               // ~4.6 syllables per second
  const phrase = 0.5 + 0.5 * Math.sin(t * 2.1 + 2 * Math.sin(t * 0.9)); // louder and softer stretches
  return clamp(syllable * (0.35 + 0.75 * phrase), 0, 1);
}
function updateTalk(now, dt) {                 // opens fast, closes a little slower, like a jaw
  const target = talkTarget(now);
  talk.level += (target - talk.level) * (1 - Math.exp(-dt / (target > talk.level ? 30 : 60)));
}

// blink
let blinkStart = -1, nextBlink = 0, doubleBlink = false;
const BLINK_CLOSE = 60, BLINK_OPEN = 95;
function blinkAmount(now) {
  if (blinkStart < 0) return 0;
  const slow = emotion === "thinking" ? 2.6 : 1;                           // a thinking blink is slow
  const t = now - blinkStart, close = BLINK_CLOSE * slow, open = BLINK_OPEN * slow;
  if (t < close) return t / close;
  if (t < close + open) return 1 - (t - close) / open;
  blinkStart = -1;
  return 0;
}
function updateBlink(now) {
  if (blinkStart < 0 && now >= nextBlink && emotion !== "surprise") {
    blinkStart = now;
    if (emotion === "thinking") { nextBlink = now + rand(1400, 2200); }       // a slow blink now and then
    else if (doubleBlink) { doubleBlink = false; nextBlink = now + 190; }
    else {
      doubleBlink = Math.random() < 0.15;
      nextBlink = doubleBlink ? now + BLINK_CLOSE + BLINK_OPEN + 90 : now + rand(2500, 6000);
    }
  }
}

// gaze: fast saccades between targets, plus a slow drift
const gaze = { x: 0, y: 0, fx: 0, fy: 0, tx: 0, ty: 0, t0: 0 };
let nextGaze = 0, nextGlance = 0;
function saccadeTo(x, y, now) {
  gaze.fx = gaze.x; gaze.fy = gaze.y; gaze.tx = x; gaze.ty = y; gaze.t0 = now;
}
function updateGaze(now) {
  if (emotion === "thinking") {                         // look up and to the side while the LLM works
    if (gaze.tx !== -5 || gaze.ty !== -4) saccadeTo(-5, -4, now);
    const k = clamp((now - gaze.t0) / 140, 0, 1);
    gaze.x = gaze.fx + (gaze.tx - gaze.fx) * k;
    gaze.y = gaze.fy + (gaze.ty - gaze.fy) * k;
    return;
  }
  const idle = emotion === "idle" && !isTalking(now);   // look at the listener while talking
  if (now >= nextGlance) {
    nextGlance = now + rand(10000, 15000);
    if (idle) {
      const dirs = [[-6, 0], [6, 0], [0, -4]];
      const d = dirs[Math.floor(Math.random() * dirs.length)];
      saccadeTo(d[0], d[1], now);
      nextGaze = now + rand(1200, 2000);          // hold the glance a moment
      return;
    }
  }
  if (now >= nextGaze) {
    nextGaze = now + rand(1500, 4000);
    const range = idle ? 1 : 0.15;                 // emotions keep the eyes near the centre
    saccadeTo(rand(-2.8, 2.8) * range, rand(-1.6, 1.6) * range, now);
  }
  const k = clamp((now - gaze.t0) / 100, 0, 1);
  const e = 1 - (1 - k) * (1 - k);
  gaze.x = gaze.fx + (gaze.tx - gaze.fx) * e;
  gaze.y = gaze.fy + (gaze.ty - gaze.fy) * e;
}

// ---------- drawing ----------
function pill(c, cx, cy, w, h, r) {            // rounded rectangle path, r 0..1 of the max radius
  const rad = Math.max(0.01, Math.min(w, h) / 2 * clamp(r, 0, 1));
  const x = cx - w / 2, y = cy - h / 2;
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function drawEye(c, e, side, ox, oy, blink, style) {
  const h = Math.max(1.2, e.h * (1 - blink * 0.94));
  const w = e.w * (1 + blink * 0.06);
  const cx = side * e.x + ox, cy = e.y + oy;
  const inner = -side;                          // direction toward the face centre
  const L = (w + h) * 2;
  c.save();
  c.beginPath(); pill(c, cx, cy, w, h, e.r); c.clip();
  // upper lid: a line through (cx, top cut), slanted by tilt
  const slope = Math.tan(e.tilt * Math.PI / 180) * inner;
  const y0 = cy - h / 2 + e.top * h;
  c.beginPath();
  c.moveTo(cx - L, y0 - slope * L); c.lineTo(cx + L, y0 + slope * L);
  c.lineTo(cx + L, cy + L); c.lineTo(cx - L, cy + L); c.closePath(); c.clip();
  if (e.bot > 0.001) {
    c.beginPath(); c.rect(cx - L, cy - L, 2 * L, L + (cy + h / 2 - e.bot * h - cy)); c.clip();
  }
  if (style) {                                  // sharp layer: brighter core fading to the rim
    const g = c.createRadialGradient(cx, cy - h * 0.12, 0, cx, cy, Math.max(w, h) * 0.62);
    g.addColorStop(0, style.core); g.addColorStop(0.55, style.col); g.addColorStop(1, style.rim);
    c.fillStyle = g;
  }
  c.beginPath();
  c.rect(cx - L, cy - L, 2 * L, 2 * L);
  if (e.bite > 0.001) {
    const off = h * (1.2 - 0.85 * clamp(e.bite, 0, 1));
    c.moveTo(cx + w * 0.6, cy + off);
    c.ellipse(cx, cy + off, w * 0.6, h * 0.55, 0, 0, Math.PI * 2);
  }
  c.fill("evenodd");
  c.restore();
}

function drawMouth(c, m, ox, oy, now, fat, style) {
  const wob = m.wob * Math.sin(now / 55) * 0.5;
  const L = talk.level;                         // talking opens the mouth, narrows and flattens it
  const mw = (m.mw + m.wob * Math.sin(now / 90) * 0.4) * (1 - 0.3 * L);
  const bend = (m.bend + wob) * (1 - 0.4 * L);
  const open = m.open + 3.6 * L;
  const fill = Math.max(m.fill, 0.22 * clamp(L * 3, 0, 1));
  const ly = m.my + oy - m.skew / 2, ry = m.my + oy + m.skew / 2;
  const lx = -mw + ox, rx = mw + ox;
  c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath();
  const k = open * 1.333;                         // an open mouth lifts the upper lip and drops the lower
  const inset = 0.65 * Math.max(0, 1 - open);     // controls move out to the ends so an open mouth is round
  // upper lip, then the lower lip follows the same curve 2k lower (a smile talks with an open smile)
  const c1x = lx + mw * inset, c1y = ly + bend * 1.33 + m.wave - k;
  const c2x = rx - mw * inset, c2y = ry + bend * 1.33 - m.wave - k;
  c.moveTo(lx, ly);
  c.bezierCurveTo(c1x, c1y, c2x, c2y, rx, ry);
  if (open > 0.05) {
    c.bezierCurveTo(c2x, c2y + 2 * k, c1x, c1y + 2 * k, lx, ly);
    c.closePath();
    if (fill > 0.01) { c.globalAlpha = fill; c.fill(); c.globalAlpha = 1; }
  }
  c.lineWidth = m.thick + fat;
  c.stroke();
  if (style) {                                  // sharp layer: a thin bright core down the line, like neon
    c.strokeStyle = style.core;
    c.lineWidth = m.thick * 0.38;
    c.stroke();
  }
}

const rgb = (v, mixWhite = 0, mul = 1) =>
  `rgb(${v.map(x => Math.round(clamp((x + (255 - x) * mixWhite) * mul, 0, 255))).join(",")})`;

// sharp = true draws the crisp face with highlights; false draws the flat shapes used for the glow
function drawScene(c, now, blink, fat, sharp) {
  const col = rgb(cur.c);
  const style = sharp ? { col, core: rgb(cur.c, 0.55), rim: rgb(cur.c, 0, 0.82) } : null;
  c.fillStyle = col; c.strokeStyle = col;
  const t = cur.tremble;
  const tx = t * (Math.sin(now / 21) + Math.sin(now / 37)) / 2;
  const ty = t * (Math.sin(now / 27) + Math.sin(now / 17)) / 2;
  // eyes move with the full gaze, the mouth with a fraction of it (parallax)
  const dx = Math.sin(now / 1900) * 0.35, dy = Math.cos(now / 2300) * 0.3;   // slow drift, ~1-2 px
  const gx = gaze.x + dx + tx, gy = gaze.y + dy + ty;
  drawEye(c, cur.l, -1, gx, gy, blink, style);
  drawEye(c, cur.r, 1, gx, gy, blink, style);
  c.strokeStyle = col;
  drawMouth(c, cur.m, gx * 0.25, gy * 0.25, now, fat, style);
}

function resize() {
  // Render at device pixels (capped at 2x) so edges stay sharp on high-density screens.
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = Math.round(canvas.clientWidth * dpr);
  H = canvas.height = Math.round(canvas.clientHeight * dpr);
  scale = Math.min(W / 110, H / 70);
  for (const g of [glowSrc, ...GLOWS]) {
    g.cv.width = Math.max(8, Math.ceil(W / GLOW_DIV));
    g.cv.height = Math.max(8, Math.ceil(H / GLOW_DIV));
  }
}

function clear(c, w, h) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = "source-over"; c.globalAlpha = 1; c.filter = "none";
  c.clearRect(0, 0, w, h);
}

function drawGlow(now, blink) {
  if (glowMode === "off") return;
  const gw = glowSrc.cv.width, gh = glowSrc.cv.height, s = scale / GLOW_DIV;
  clear(glowSrc.ctx, gw, gh);
  glowSrc.ctx.setTransform(s, 0, 0, s, gw / 2, gh / 2);
  drawScene(glowSrc.ctx, now, blink, 0.5, false);
  ctx.globalCompositeOperation = "lighter";
  for (const g of GLOWS) {
    let src = glowSrc.cv;
    if (canBlur && glowMode !== "cheap") {
      clear(g.ctx, gw, gh);
      g.ctx.filter = `blur(${(g.blur * s).toFixed(1)}px)`;
      g.ctx.drawImage(glowSrc.cv, 0, 0);
      src = g.cv;
    }
    ctx.globalAlpha = g.alpha;
    ctx.drawImage(src, 0, 0, W, H);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

let last = 0;
function frame(now) {
  const dt = Math.min(now - last, 100); last = now;
  if (frozen) {
    Object.assign(cur, clone(FACES[frozen]));
    gaze.x = gaze.y = 0;
    talk.level = frozenTalk;
  } else {
    if (holdUntil && now >= holdUntil) { emotion = "idle"; holdUntil = 0; }
    approach(cur, FACES[emotion === "idle" ? "neutral" : emotion], 1 - Math.exp(-dt / 90));
    updateBlink(now);
    updateGaze(now);
    updateTalk(now, dt);
  }
  const blink = frozen ? 0 : blinkAmount(now);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  drawGlow(now, blink);                          // halo first, so the crisp face on top keeps its exact colour
  ctx.setTransform(scale, 0, 0, scale, W / 2, H / 2);
  drawScene(ctx, now, blink, 0, true);
  requestAnimationFrame(frame);
}

// ---------- the screen: the face, or a content view with small eyes in the corner ----------
const el = id => document.getElementById(id);
function send(choice) {
  if (preview) return;
  fetch("/input", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ choice }) }).catch(() => {});
}
function showScreen(u) {
  const split = u.layout === "split" && u.view && u.view !== "face";
  document.body.classList.toggle("split", !!split);
  document.body.classList.toggle("full", !split);
  document.body.classList.toggle("zone-quiet", u.zone === "quiet");
  document.body.dataset.zone = u.zone || "common";
  document.body.classList.toggle("thinking", !!u.thinking);          // a progress indicator while the LLM works
  Views.render(u, el("view"), send, showScreen);
  document.body.classList.toggle("touch", !!el("view").querySelector("button"));
  el("state").textContent = params.has("debug") ? `${u.state_path || ""} · ${u.zone || ""} · ${u.view || "face"}` : "";
  resize();
}
if (params.has("update")) {
  try { showScreen(JSON.parse(params.get("update"))); } catch (_) { /* a bad debug parameter: just the face */ }
}

// ---------- events ----------
function connect() {
  let es;
  try { es = new EventSource("/events"); } catch (_) { setTimeout(connect, 1000); return; }
  es.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      if (d.talk) { startTalk(d.talk, performance.now()); return; }
      if (d.screen) { showScreen(d.screen); return; }
      const name = ALIASES[String(d.emotion || "").toLowerCase()];
      if (!name) return;
      const hold = Number(d.hold_s);
      setEmotion(name, hold > 0 ? hold : 3, performance.now());
    } catch (_) { /* ignore malformed events */ }
  };
  es.onerror = () => {                          // the browser retries on its own unless it gave up
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 1000);
  };
}

// An open page picks up a new version of itself (a kiosk is never reloaded by hand): when the files change, reload.
(function watchVersion() {
  let seen = null;
  const check = () => fetch("/ui-version", { cache: "no-store" }).then(r => r.json()).then(d => {
    if (seen === null) seen = d.version; else if (d.version !== seen) location.reload();
  }).catch(() => {});
  check(); setInterval(check, 3000);
})();

window.addEventListener("resize", resize);
resize();
nextBlink = performance.now() + rand(1500, 3500);
nextGaze = performance.now() + 1500;
nextGlance = performance.now() + rand(10000, 15000);
if (!frozen && location.protocol !== "file:") connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
