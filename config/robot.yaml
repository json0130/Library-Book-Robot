# Robot settings. Environment variables AI_HOST / AI_PORT override the AI server address.

ai_server:
  host: 172.24.47.255
  port: 7898
  timeout_s: 300          # LLM/TTS requests can be slow on a busy server
  llm_timeout_s: 20       # book explanations/recommendations: if the LLM is slower, use the catalogue text

display:                  # the face page served by `python -m display.server`
  host: 127.0.0.1
  port: 8765

devices:
  esp32_port: /dev/ttyUSB0
  esp32_baud: 115200
  camera_index: 0
  camera_width: 640       # this webcam gives 30 fps at 640x480 but only ~8 fps at 1280x720; 640x480 read
  camera_height: 480      # barcodes fine when tested. Use 1280/720 for smaller or more distant barcodes.
  mic: null               # part of a PulseAudio source name, null = system default
  speaker: USB            # part of a PulseAudio sink name, null = system default

books:
  catalog_path: data/catalog.csv   # SAMPLE data until the library's real catalogue replaces it
  topics_path: data/topics.yaml    # the topic vocabulary: synonyms and broader topics (docs/catalog.md)
  shelves_path: data/shelves.csv   # where each shelf is: section, floor, zone and map pose
  links_path: data/curated_links.csv   # hand-made links between books (series_next, librarian_pick, related)
  online_fallback: true            # Open Library (title/author only) for ISBNs not in the catalogue
  cache_dir: data/cache            # cached Open Library answers, gitignored
  scan_timeout_s: 5                # how long to look for a barcode after a book is placed
  scanner_camera_index: 0          # camera pointed at the scan pad
  use_llm: true                    # explain/recommend through the LLM (falls back to catalogue text); false = catalogue only
  similarity:                      # how recommendations are scored (services/book_graph.py); each component is 0..1
    topics: 0.30                   # shared topics, weighted by rarity (IDF): "astronomy" counts for more than "fiction"
    broader: 0.10                  # topics that meet under a broader one ("astronomy" and "physics" both under "science")
    author: 0.12                   # the same author
    series: 0.15                   # the same series; the next book in a series is always ranked first
    call_number: 0.08              # how deep a prefix the Dewey / Library of Congress call numbers share
    curated: 0.10                  # librarian_pick and related rows in curated_links.csv
    text: 0.15                     # TF-IDF similarity of the summaries and subjects
    min_score: 0.08                # books scoring below this (the total is 0..1) are not recommended
    general_topics: 0.4            # a general topic (science, fiction: it has a narrower child in topics.yaml) is worth this fraction of its rarity weight

dialogue:
  greet_cooldown_s: 120   # say hello at most once per visit and once per this many seconds (a person leaving the camera's view and returning isn't greeted again)

perception:               # face detection for `python -m robot sim --faces`
  face_interval_s: 1.0    # how often a camera frame is sent to the AI server
  arrive_frames: 2        # samples in a row with a new face before the person counts as arrived
  identify: true          # give faces person numbers (person 1, 2...) so a returning visitor isn't greeted again; needs `python tools/get_face_models.py`
  identity_threshold: 0.40   # how alike two faces must be to be the same person (cosine similarity, 0..1): higher = stricter, more new people
  leave_after_s: 8        # how long a face must stay missing before the person counts as gone (looking down at a book is not leaving)

voice:
  tts_voice: af_heart     # the AI server's only TTS voice today (a woman's)
  pace: 1.12              # speak this much faster (sox tempo, same pitch): Stuart is energetic. 1.0 = normal
  deepen: 1.0             # lower the pitch with sox: 0.8 is ~4 semitones down, 1.0 = off (it didn't sound right on af_heart)
  whisper_volume: 0.35    # playback volume multipliers per voice style
  normal_volume: 1.0

thresholds:
  emotion_min_confidence: 0.5   # ignore detected user emotions below this
  face_similarity: 0.6          # recognition match threshold (the server's default)
  min_speech_rms: 500           # recordings quieter than this count as silence

logging:
  session_dir: data/logs        # JSON-lines study logs, gitignored
