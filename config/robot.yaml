# Robot settings. Environment variables AI_HOST / AI_PORT override the AI server address.

ai_server:
  host: 172.24.30.251
  port: 7898
  timeout_s: 300          # LLM/TTS requests can be slow on a busy server
  keepalive_s: 240        # while idle, a tiny request this often keeps the model loaded (the first answer is not slow); 0 = off
  llm_timeout_s: 20       # book explanations/recommendations: if the LLM is slower, use the catalogue text
  tts_port: null          # null = the main port; the server offers both TTS engines there (set a number only for a separate TTS server)

intents:                  # the intent router in front of the LLM (robot/core/intents.py)
  word_similarity: 0.8    # how alike two words must be to count as the same word (typos, speech-recognition slips)
  short_word_similarity: 0.85   # stricter for words of up to four letters (one- and two-letter words must be exact)
  min_confidence: 0.7     # below this a match is not acted on and the LLM is asked instead
  ambiguity_margin: 0.15  # two places closer than this (the History section vs "A Brief History of Time"): ask which
  repair_after: 2         # utterances in a row not understood in one state, then show the choices as buttons ("I'm done" always)
  thinking_ack_s: 1.5     # common zone: say "Let me check." if the LLM has not answered after this many seconds
  expected_word_similarity: 0.65    # right after a question with a few answers (guide offer, "anything else?", "did you mean"),
  expected_phrase_similarity: 0.68  # a short reply is matched against only those answers, this loosely ("guy me" = guide me)
  expected_max_words: 4             # ...if it has up to this many words (fillers like "er" and "please" not counted)

scenarios:                # the scenario test harness: python -m robot scenarios ... (docs/testing.md)
  typo_probability: 0.05  # chance that a `say` step gets realistic typos
  speech_probability: 0.3 # chance that a `say` step gets speech-recognition style changes (the list is config/speech_errors.yaml)
  think_s: 0.8            # robot-seconds the pretend visitor waits after the robot has finished, before the next step
  run_timeout_s: 240      # real seconds before a run is stopped and marked as stuck
  latency:                # thresholds for the latency checks (real milliseconds)
    first_feedback_ms: 500      # a screen update or the thinking indication
    first_sentence_ms: 1000     # first content sentence of a deterministic / catalogue answer
    first_sentence_llm_ms: 6000 # ...of an answer that waited for the LLM
  robot_overrides:        # robot settings used in the runs (above: auto-return and the timeouts are off for manual tests)
    returning: {auto_start: true}
    timeouts: {enabled: true}
    screen: {greeting_hold_s: 0}            # the runs do not wait for the hello to be read

screen:                   # what the robot's screen shows next to its face (robot/core/screen.py)
  content_ttl_s: {quiet: 30, common: 15}    # a book card, list or map stays this long after the last interaction, then
                                            # the face comes back (a quiet zone reads; a common area mostly listens)
  summary_chars: {quiet: 180, common: 110}  # how much of a summary the book card shows
  greeting_hold_s: 2.5                      # the hello stays on the full face at least this long (spoken or not), then the options appear

display:                  # the face page served by `python -m display.server`
  host: 127.0.0.1         # where the robot reaches it
  port: 8765
  bind_host: 0.0.0.0      # what the display server listens on. 0.0.0.0 lets a laptop on the same network open
                          # http://<robot-ip>:8765/operator (a view-only face/screen preview is inside it). Only the robot's own computer can
                          # use everything else (the face page's buttons, /screen, /input...). There is no password: use a network you trust,
                          # or set 127.0.0.1 to allow only this computer.
  camera_fps: 15          # pictures per second sent to the operator page while someone has it open (1 a second when nobody does)
  camera_width: 480       # ...shrunk to this width in pixels (smaller = quicker); the page shows it at about this size
  poll_s: 0.3             # how often the robot asks the display server for button taps and operator input

devices:
  esp32_port: /dev/ttyUSB0
  esp32_baud: 115200
  camera_index: 0
  camera_width: 640       # this webcam gives 30 fps at 640x480 but only ~8 fps at 1280x720; 640x480 read
  camera_height: 480      # barcodes fine when tested. Use 1280/720 for smaller or more distant barcodes.
  mic: null               # part of a PulseAudio source name, null = system default
  speaker: USB            # part of a PulseAudio sink name, null = system default

books:
  catalog_path: data/catalog.csv   # SAMPLE data until the library's real catalogue replaces it
  topics_path: data/topics.yaml    # the topic vocabulary: synonyms and broader topics (docs/catalog.md)
  shelves_path: data/shelves.csv   # where each shelf is: section, floor, zone and map pose
  links_path: data/curated_links.csv   # hand-made links between books (series_next, librarian_pick, related)
  online_fallback: true            # Open Library (title/author only) for ISBNs not in the catalogue
  cache_dir: data/cache            # cached Open Library answers, gitignored
  scan_timeout_s: 5                # how long to look for a barcode after a book is placed
  scanner_camera_index: 0          # camera pointed at the scan pad
  floorplan_path: data/floorplan.yaml   # floors, sections (rectangles in map metres) and landmarks, for the directions view
  covers_dir: data/covers          # covers from `python tools/import_books.py --covers-only` (gitignored); missing ones get a placeholder
  reader: camera                   # how the book on the pad is read: camera (barcode); rfid is a stub that says "not implemented"
  use_llm: true                    # explain/recommend through the LLM (falls back to catalogue text); false = catalogue only
  similarity:                      # how recommendations are scored (services/book_graph.py); each component is 0..1
    topics: 0.30                   # shared topics, weighted by rarity (IDF): "astronomy" counts for more than "fiction"
    broader: 0.10                  # topics that meet under a broader one ("astronomy" and "physics" both under "science")
    author: 0.12                   # the same author
    series: 0.15                   # the same series; the next book in a series is always ranked first
    call_number: 0.08              # how deep a prefix the Dewey / Library of Congress call numbers share
    curated: 0.10                  # librarian_pick and related rows in curated_links.csv
    text: 0.15                     # TF-IDF similarity of the summaries and subjects
    min_score: 0.08                # books scoring below this (the total is 0..1) are not recommended
    general_topics: 0.4            # a general topic (science, fiction: it has a narrower child in topics.yaml) is worth this fraction of its rarity weight

# The state machine (docs/state_machine.md). All times are seconds.
timeouts:                 # how long each waiting state waits for the visitor before the robot says goodbye
  enabled: false          # OFF for now: the robot waits for the visitor to answer, and only a person leaving (or "bye") ends the
                          # visit. true = the values below apply. (The goodbye itself, farewell_s, always runs.)
  offer_s: 30
  await_book_s: 30
  scan_s: 20              # a safety net: the book reader gives up on its own after books.scan_timeout_s
  store_s: 30             # waiting for the pad to drop the book into its slot
  answer_s: 30
  anything_else_s: 20
  farewell_s: 3           # how long the goodbye lasts

engagement:               # when a person counts as wanting to talk (perception/people.py)
  require_close: false    # false: any human face greets (no closeness check yet). true: the face must also be min_face_px tall
  min_face_px: 60         # (with require_close) a face this tall or taller is close enough (about 1.5 m on a 640x480 webcam; measure yours with tools/camera_test.py)
  dwell_s: 0.5            # a face must stay in view this long before the robot greets
  leave_grace_s: 60       # if the visitor spoke, typed or tapped within this long, the camera losing their face does not end the visit;
                          # the goodbye waits until they have been quiet this long with no face in view
  left_after_s: 12        # no face seen for this long: they have left. Long, because a face is lost while looking down at a book
                          # or turning to the pad (the OpenCV detector loses turned faces more than the server's)

storage:                  # the storage ring that holds returned books until they are put back on their shelves
  slots: 6                # how many books the robot holds at once (null = the ring's own size, 8). Remembered across restarts
  path: data/state/storage.json   # kept here so a restart does not lose the stored books (gitignored)
  sim_drop_s: 4           # simulated "the pad dropped the book"; 0 = wait for the operator's `dropped`

returning:                # putting the stored books back
  auto_start: false       # OFF for testing: returned books stay in storage. true = after a session ends with books in storage,
                          # go and put them back by itself (the operator's `goto RETURNING` still starts a trip by hand)
  auto_start_delay_s: 10  # ...once nobody has engaged for this long
  sim_drive_s: 6          # simulated drive to a shelf (or home)
  sim_unload_s: 3         # simulated unload at a shelf
  announce_s: 3           # how long the "excuse me" signal lasts when someone is near but busy
  home: {x: 0.0, y: 0.0, yaw: 0.0}   # the robot's home spot on the map (TODO: set the real one)

dialogue:
  greet_cooldown_s: 120   # say hello at most once per visit and once per this many seconds (a person leaving the camera's view and returning isn't greeted again)

perception:               # face detection for `python -m robot sim --faces`
  detector: server        # server = the AI server's model; local = OpenCV on the robot (same as --local-faces; frontal faces, less accurate)
  face_interval_s: 1.0    # how often a camera frame is sent to the AI server
  arrive_frames: 2        # samples in a row with a new face before the person counts as arrived
  identify: true          # give faces person numbers (person 1, 2...) so a returning visitor isn't greeted again; needs `python tools/get_face_models.py`
  identity_threshold: 0.40   # how alike two faces must be to be the same person (cosine similarity, 0..1): higher = stricter, more new people
  leave_after_s: 8        # how long a face must stay missing before the person counts as gone (looking down at a book is not leaving)

voice:
  tts_engine: kokoro      # kokoro = fast (under 2 s a sentence); indextts = slower (4-30 s a sentence) and a different voice
  tts_voice: af_heart     # the voice name (a woman's)
  pace: 1.12              # speak this much faster (sox tempo, same pitch): Stuart is energetic. 1.0 = normal
  deepen: 1.0             # lower the pitch with sox: 0.8 is ~4 semitones down, 1.0 = off (it didn't sound right on af_heart)
  whisper_volume: 0.35    # playback volume multipliers per voice style
  normal_volume: 1.0

thresholds:
  emotion_min_confidence: 0.5   # ignore detected user emotions below this
  face_similarity: 0.6          # recognition match threshold (the server's default)
  min_speech_rms: 500           # recordings quieter than this count as silence

logging:
  session_dir: data/logs        # JSON-lines study logs, gitignored
