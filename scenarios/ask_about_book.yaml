name: ask_about_book
description: A visitor places a book, asks what it is about, asks who wrote it (the catalogue knows) and how many pages it has (it does not), asks where it is, and is guided there.
zones: [quiet, common]
steps:
  - engage
  - place_book: random
  - say: ["tell me about it", "what is this book about?", "can you explain {title}?"]
  - say:
      text: ["who wrote it?", "who is the author of {title}?"]
      answerable: true
  - say:
      text: ["how many pages does it have?", "how many pages is it?"]
      unanswerable: true
  - say: ["where is it?", "where is {title} located?", "where does it go?"]
  - one_of:
      - name: guide_by_tap
        steps:
          - tap: "Guide me"
      - name: guide_by_voice
        steps:
          - say: ["guide me", "take me there", "show me the way"]
  - say: ["that's all, thanks", "I'm done"]
  - wait: {until_state: IDLE, timeout: 60}
expect:
  - {state_path: [ENGAGED.SCAN, ENGAGED.ANSWER, ENGAGED.ANYTHING_ELSE, ENGAGED.FAREWELL]}
  - {views: [book_card, directions]}
  - {events: [NavigationRequested]}
